# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
# Configuration cache is disabled: the Android + R8 toolchain here has not been validated with it
# enabled, and a cache mismatch would surface as confusing incremental-build failures.
org.gradle.configuration-cache=false

# AndroidX support
android.useAndroidX=true
android.enableJetifier=false

android.suppressUnsupportedCompileSdk=35
